name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Validar lint e regras
        run: |
          npm run lint
          npm test
          npm run sql:validar
      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium
      - name: Validar demonstração ponta a ponta
        run: npm run test:e2e
      - name: Validar configuração e gerar build
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Configure VITE_SUPABASE_URL nas variáveis do repositório."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Configure VITE_SUPABASE_ANON_KEY nas variáveis do repositório."; exit 1; }
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
