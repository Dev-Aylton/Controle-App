<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F7A65" />
    <link rel="icon" type="image/svg+xml" href="/Controle-App/favicon.svg" />
    <link rel="apple-touch-icon" href="/Controle-App/apple-touch-icon-180x180.png" />
    <title>Controle-App</title>
    <script>
      (() => {
        const saved = localStorage.getItem('controle-app-theme') || 'system';
        const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
